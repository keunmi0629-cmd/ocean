<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOC Insight · 문서 챗봇</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236c5ce7'/%3E%3Cpath d='M18 18h20l8 8v20H18z' fill='white'/%3E%3Cpath d='M38 18v10h10' fill='none' stroke='%236c5ce7' stroke-width='4'/%3E%3C/svg%3E" />
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
    :root { --ink:#18213c; --muted:#707994; --primary:#635bdb; --violet:#8b5cf6; --line:#e9eaf4; --paper:#fff; --bg:#f6f6fd; --good:#11a877; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 12% 0%,#e4e0ff 0,transparent 28rem),radial-gradient(circle at 95% 85%,#d9f7ef 0,transparent 30rem),var(--bg); font-family:'DM Sans','Noto Sans KR',sans-serif; }
    .shell { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:34px 0 42px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:25px; } .brand { display:flex; gap:11px; align-items:center; font-weight:700; letter-spacing:-.5px; font-size:1.13rem; } .mark { width:36px; height:36px; display:grid; place-items:center; border-radius:12px; color:#fff; background:linear-gradient(135deg,#7467ee,#a75ae7); box-shadow:0 8px 18px #7569e044; font-size:1.1rem; }
    .pill { padding:8px 12px; border:1px solid #e1e0f4; border-radius:999px; background:#ffffffa8; color:#6d669c; font-size:.78rem; font-weight:600; }
    main { display:grid; grid-template-columns:350px 1fr; gap:18px; min-height:650px; } .card { background:#ffffffdd; border:1px solid #ffffff; box-shadow:0 15px 45px #30345b12; border-radius:24px; }
    .sidebar { padding:22px; display:flex; flex-direction:column; } h1 { font-size:1.42rem; letter-spacing:-.8px; margin:4px 0 9px; } .intro { margin:0 0 20px; color:var(--muted); line-height:1.58; font-size:.9rem; }
    .dropzone { min-height:193px; border:1.5px dashed #c9c6ec; border-radius:18px; background:linear-gradient(145deg,#f8f7ff,#f1f7ff); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; cursor:pointer; transition:.2s; } .dropzone:hover,.dropzone.drag { border-color:var(--primary); background:#f1efff; transform:translateY(-1px); }.file-icon{font-size:2.05rem;margin-bottom:8px}.dropzone strong{font-size:.91rem}.dropzone span{font-size:.76rem;color:var(--muted);margin-top:5px}.dropzone input{display:none}
    .file-card { display:none; margin-top:14px; padding:13px; background:#f6f5ff; border-radius:14px; align-items:center; gap:10px; }.file-card.show{display:flex}.file-card .doc{width:31px;height:35px;border-radius:8px;background:#6b63dc;color:white;display:grid;place-items:center;font-weight:700;font-size:.65rem}.file-info{min-width:0;flex:1}.file-info b,.file-info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-info b{font-size:.8rem}.file-info span{color:var(--muted);font-size:.7rem;margin-top:2px}.reset{border:0;background:transparent;color:#827bbd;font-size:1.1rem;cursor:pointer}
    .json-panel { margin-top:auto; padding-top:22px; }.json-top{display:flex;justify-content:space-between;align-items:center}.json-top b{font-size:.85rem}.save{border:0;background:#ebeafd;color:#574fc9;padding:7px 9px;border-radius:8px;font:600 .7rem inherit;cursor:pointer}.save:disabled{opacity:.45;cursor:not-allowed}.json-note{margin:8px 0 0;color:var(--muted);font-size:.75rem;line-height:1.5}
    .chat { display:flex; flex-direction:column; overflow:hidden; }.chat-top{padding:22px 25px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#26244d,#625aca);color:#fff;display:grid;place-items:center;font-size:1.15rem}.chat-title b,.chat-title span{display:block}.chat-title b{font-size:.95rem}.chat-title span{font-size:.74rem;color:var(--good);margin-top:2px}.chat-title span:before{content:'●';font-size:.55rem;margin-right:4px}.count{margin-left:auto;color:var(--muted);font-size:.75rem;background:#f6f6fb;padding:7px 10px;border-radius:9px}
    .conversation { flex:1; padding:26px 25px; overflow:auto; min-height:430px; }.message{display:flex;gap:10px;margin-bottom:20px;align-items:flex-start}.message.user{justify-content:flex-end}.bubble{max-width:min(640px,85%);padding:13px 15px;border-radius:5px 17px 17px 17px;background:#f2f1fa;color:#46475d;font-size:.91rem;line-height:1.64}.user .bubble{border-radius:17px 5px 17px 17px;background:linear-gradient(135deg,#665de0,#8461e7);color:white;box-shadow:0 7px 17px #7166d136}.bot-mini{width:28px;height:28px;flex:0 0 auto;border-radius:10px;background:#ebeaff;color:#665fce;display:grid;place-items:center;font-size:.83rem}.answer-meta{display:flex;gap:8px;align-items:center;margin-top:10px;color:#756e9b;font-size:.72rem}.score{background:#e6f7f0;color:#14845e;padding:3px 7px;border-radius:99px;font-weight:700}.source{margin-top:10px;border-left:3px solid #b4afea;padding:8px 10px;background:#fbfaff;color:#65647a;font-size:.79rem;line-height:1.55}.empty-title{font-weight:600;color:var(--ink);margin-bottom:3px}
    .suggestions{padding:0 25px 14px;display:flex;gap:7px;overflow:auto}.suggestions button{white-space:nowrap;border:1px solid #e7e5f4;background:white;color:#706a91;border-radius:999px;padding:7px 10px;font:500 .74rem inherit;cursor:pointer}.suggestions button:hover{border-color:#aaa3e8;color:#554ec3}.composer{margin:0 18px 18px;padding:7px 7px 7px 15px;display:flex;gap:9px;align-items:center;background:#f6f6fb;border:1px solid #ececf5;border-radius:16px}.composer input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:400 .91rem inherit;color:var(--ink)}.composer input::placeholder{color:#9fa3b5}.send{width:38px;height:38px;border:0;border-radius:12px;background:var(--primary);color:white;font-size:1rem;cursor:pointer;transition:.2s}.send:hover{transform:translateY(-1px);background:#5048c9}.send:disabled{opacity:.5;cursor:not-allowed;transform:none}
    @media (max-width:780px){.shell{width:min(100% - 22px,600px);padding-top:18px}main{grid-template-columns:1fr}.sidebar{padding:18px}.json-panel{margin-top:22px}.chat{min-height:580px}.conversation{padding:20px 16px}.chat-top{padding:18px}.suggestions{padding:0 16px 12px}.composer{margin:0 12px 12px}.pill{display:none}}
  </style>
</head>
<body>
  <div class="shell"><header><div class="brand"><div class="mark">✦</div>DOC Insight</div><div class="pill">내 브라우저에서 안전하게 처리됨</div></header>
  <main><aside class="sidebar card"><h1>문서를 대화로 읽으세요</h1><p class="intro">DOCX 문서를 JSON 지식으로 바꾼 뒤, 질문과 가장 가까운 내용을 찾아 답합니다.</p>
    <label class="dropzone" id="dropzone"><input id="fileInput" type="file" accept=".docx,.doc"/><div class="file-icon">📄</div><strong>문서를 여기로 끌어오세요</strong><span>DOC와 DOCX 파일을 지원합니다</span></label>
    <div class="file-card" id="fileCard"><div class="doc">DOCX</div><div class="file-info"><b id="fileName"></b><span id="fileInfo"></span></div><button class="reset" id="resetBtn" title="문서 지우기">×</button></div>
    <div class="json-panel"><div class="json-top"><b>추출된 JSON</b><span><button class="save" id="downloadDocx" disabled>DOCX 저장</button> <button class="save" id="downloadJson" disabled>JSON 저장</button></span></div><p class="json-note" id="jsonNote">문서를 올리면 문단별 JSON 데이터가 생성됩니다.</p></div>
  </aside>
  <section class="chat card"><div class="chat-top"><div class="avatar">✦</div><div class="chat-title"><b>문서 도우미</b><span id="status">문서를 기다리는 중</span></div><div class="count" id="count">0개 문단</div></div>
    <div class="conversation" id="conversation"><div class="message"><div class="bot-mini">✦</div><div class="bubble"><div class="empty-title">안녕하세요!</div>왼쪽에서 DOCX 파일을 업로드하면 문서 내용을 분석해 질문에 답해드릴게요.</div></div></div>
    <div class="suggestions" id="suggestions"><button disabled>문서를 올려주세요</button></div>
    <form class="composer" id="chatForm"><input id="question" autocomplete="off" placeholder="문서를 업로드한 뒤 질문해 보세요" disabled/><button class="send" id="send" disabled aria-label="질문 전송">↑</button></form>
  </section></main></div>
<script>
  const $ = s => document.querySelector(s); let knowledge = [], currentJson = null, convertedBlob = null, convertedName = '';
  const stopwords = new Set('은 는 이 가 을 를 에 의 와 과 도 로 으로 에서 에게 한 하다 있다 없다 그리고 또는 그 것 수 및 대한 하는 되어 내용 관련 위한'.split(' '));
  function tokens(text){ return (text.toLowerCase().match(/[가-힣a-z0-9]{2,}/g)||[]).filter(x=>!stopwords.has(x)); }
  function score(query, text){ const q=tokens(query), t=tokens(text); if(!q.length||!t.length) return 0; const freq={}; t.forEach(w=>freq[w]=(freq[w]||0)+1); let hit=0; q.forEach(w=>{if(freq[w]) hit+=1+Math.log(freq[w])}); const phrase=text.toLowerCase().includes(query.trim().toLowerCase())?1.4:0; return (hit/q.length+phrase)/Math.sqrt(Math.max(1,t.length)/22); }
  function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function addMessage(text, who, answer){ const div=document.createElement('div'); div.className='message '+who; if(who==='bot') div.innerHTML=`<div class="bot-mini">✦</div><div class="bubble">${answer?answer:escapeHtml(text)}</div>`; else div.innerHTML=`<div class="bubble">${escapeHtml(text)}</div>`; $('#conversation').append(div); $('#conversation').scrollTop=$('#conversation').scrollHeight; }
  function setSuggestions(){ const examples=['이 문서의 핵심 내용은 무엇인가요?','주요 일정이나 날짜를 알려주세요','중요한 조건을 요약해 주세요']; $('#suggestions').innerHTML=examples.map(x=>`<button>${x}</button>`).join(''); [...$('#suggestions').children].forEach(b=>b.onclick=()=>{ $('#question').value=b.textContent; ask(); }); }
  function legacyDocText(buffer){ const bytes=new Uint8Array(buffer); const candidates=[new TextDecoder('utf-16le').decode(bytes),new TextDecoder('windows-1252').decode(bytes)]; const chunks=candidates.flatMap(text=>(text.replace(/[\x00-\x1f]+/g,'\n').match(/[가-힣A-Za-z0-9][가-힣A-Za-z0-9 .,!?()/:;'"\-]{4,}/g)||[])).map(x=>x.trim()); return [...new Set(chunks)].filter(x=>!/(Microsoft|Normal\.dot|WordDocument|SummaryInformation)/i.test(x)).join('\n'); }
  async function convertDoc(file){ const extracted=legacyDocText(await file.arrayBuffer()); if(extracted.length<20) throw new Error('text extraction failed'); const paras=extracted.split(/\n+/).filter(x=>x.length>2).map(t=>new docx.Paragraph({children:[new docx.TextRun(t)]})); const output=new docx.Document({sections:[{children:paras}]}); convertedBlob=await docx.Packer.toBlob(output); convertedName=file.name.replace(/\.doc$/i,'')+'-converted.docx'; return new File([convertedBlob],convertedName,{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}); }
  async function handleFile(file){ if(!file) return; if(!/\.(docx|doc)$/i.test(file.name)){ alert('DOC 또는 DOCX 파일을 선택해 주세요.'); return; } if(!window.mammoth){alert('문서 처리 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');return;} try{ $('#status').textContent=/\.doc$/i.test(file.name)?'DOC를 DOCX로 변환 중':'문서 분석 중'; let input=file, wasConverted=false; if(/\.doc$/i.test(file.name)){ if(!window.docx) throw new Error('converter unavailable'); input=await convertDoc(file); wasConverted=true; } $('#status').textContent='문서 분석 중'; const result=await mammoth.extractRawText({arrayBuffer:await input.arrayBuffer()}); const raw=result.value.replace(/\r/g,''); const paragraphs=raw.split(/\n{2,}|\n/).map(x=>x.trim()).filter(x=>x.length>2); knowledge=paragraphs.map((text,index)=>({id:index+1, text, keywords:[...new Set(tokens(text))].slice(0,12)})); currentJson={document:{name:input.name, originalName:file.name, importedAt:new Date().toISOString(), format:'docx', convertedFromDoc:wasConverted}, paragraphs:knowledge}; $('#fileName').textContent=input.name; $('#fileInfo').textContent=`${wasConverted?'DOC → DOCX · ':''}${knowledge.length}개 문단 · ${(file.size/1024).toFixed(1)} KB`; $('#fileCard').classList.add('show'); $('#jsonNote').textContent=wasConverted?`DOC 파일을 DOCX로 변환하고 ${knowledge.length}개 문단을 JSON 지식으로 준비했습니다.`:`${knowledge.length}개 문단이 JSON 지식으로 준비되었습니다.`; $('#downloadJson').disabled=false; $('#downloadDocx').disabled=!wasConverted; $('#status').textContent='질문할 준비 완료'; $('#count').textContent=`${knowledge.length}개 문단`; $('#question').disabled=false; $('#send').disabled=false; $('#question').placeholder='문서에 관해 무엇이든 물어보세요'; $('#conversation').innerHTML=''; addMessage('', 'bot', `<div class="empty-title">문서 분석이 끝났어요</div><b>${escapeHtml(input.name)}</b>에서 ${knowledge.length}개 문단을 찾았습니다.${wasConverted?' 변환된 DOCX는 왼쪽에서 저장할 수 있어요.':''}`); setSuggestions(); }catch(e){console.error(e);alert('문서를 변환하거나 읽지 못했습니다. 암호화·스캔·복잡한 서식이 있는 DOC는 Word에서 DOCX로 저장한 뒤 다시 시도해 주세요.');$('#status').textContent='문서를 기다리는 중';} }
  function ask(){ const input=$('#question'), q=input.value.trim(); if(!q||!knowledge.length)return; addMessage(q,'user'); input.value=''; const ranked=knowledge.map(p=>({...p,score:score(q,p.text)})).sort((a,b)=>b.score-a.score); const best=ranked[0]; if(!best||best.score<0.08){ addMessage('', 'bot', `<div class="empty-title">관련 내용을 찾기 어려워요</div>다른 표현으로 질문하거나, 문서에 포함된 핵심 단어를 사용해 보세요.`); return; } const confidence=Math.min(98,Math.round(50+best.score*31)); const excerpt=best.text.length>520?best.text.slice(0,520)+'…':best.text; const related=ranked.slice(1,3).filter(x=>x.score>0.1).map(x=>`<li>${escapeHtml(x.text.slice(0,100))}${x.text.length>100?'…':''}</li>`).join(''); addMessage('', 'bot', `<div class="empty-title">문서에서 찾은 답변</div>${escapeHtml(excerpt)}<div class="answer-meta"><span class="score">유사도 ${confidence}%</span><span>문단 ${best.id}</span></div>${related?`<div class="source"><b>함께 참고할 내용</b><ul>${related}</ul></div>`:''}`); }
  $('#chatForm').addEventListener('submit',e=>{e.preventDefault();ask()}); $('#fileInput').addEventListener('change',e=>handleFile(e.target.files[0])); const dz=$('#dropzone'); ['dragenter','dragover'].forEach(x=>dz.addEventListener(x,e=>{e.preventDefault();dz.classList.add('drag')})); ['dragleave','drop'].forEach(x=>dz.addEventListener(x,e=>{e.preventDefault();dz.classList.remove('drag')})); dz.addEventListener('drop',e=>handleFile(e.dataTransfer.files[0])); $('#downloadJson').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(currentJson,null,2)],{type:'application/json'}));a.download=(currentJson.document.name.replace(/\.docx$/i,'')||'document')+'.json';a.click();URL.revokeObjectURL(a.href)}; $('#downloadDocx').onclick=()=>{if(!convertedBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(convertedBlob);a.download=convertedName;a.click();URL.revokeObjectURL(a.href)}; $('#resetBtn').onclick=()=>{knowledge=[];currentJson=null;convertedBlob=null;convertedName='';$('#fileInput').value='';$('#fileCard').classList.remove('show');$('#downloadJson').disabled=true;$('#downloadDocx').disabled=true;$('#jsonNote').textContent='문서를 올리면 문단별 JSON 데이터가 생성됩니다.';$('#status').textContent='문서를 기다리는 중';$('#count').textContent='0개 문단';$('#question').disabled=true;$('#send').disabled=true;$('#question').placeholder='문서를 업로드한 뒤 질문해 보세요';$('#conversation').innerHTML='<div class="message"><div class="bot-mini">✦</div><div class="bubble"><div class="empty-title">안녕하세요!</div>왼쪽에서 DOC 또는 DOCX 파일을 업로드하면 문서 내용을 분석해 질문에 답해드릴게요.</div></div>';$('#suggestions').innerHTML='<button disabled>문서를 올려주세요</button>';};
</script></body></html>
